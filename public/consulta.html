<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Consulta de Factura Electrónica — SCI</title>
  <style>
    :root {
      --sci-teal: #0f4c5c;
      --sci-accent: #38b2ac;
      --sci-bg: #f3f7f8;
      --sci-surface: #ffffff;
      --sci-text: #1a2e35;
      --sci-muted: #5b7380;
      --sci-border: #d5e2e7;
      --sci-danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      max-width: 100%;
      overflow-x: clip;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--sci-bg);
      color: var(--sci-text);
      padding: 0.85rem 0.7rem;
    }
    main {
      max-width: 720px;
      min-width: 0;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 0.35rem;
      color: var(--sci-teal);
      font-size: clamp(1.3rem, 5vw, 1.75rem);
    }
    .sub {
      margin: 0 0 1rem;
      color: var(--sci-muted);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      padding: 1rem;
      background: var(--sci-surface);
      border: 1px solid var(--sci-border);
      border-radius: 12px;
    }
    label { font-weight: 600; color: var(--sci-teal); }
    input {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 48px;
      padding: 0.75rem 0.85rem;
      border: 1px solid var(--sci-border);
      border-radius: 10px;
      box-sizing: border-box;
    }
    .actions {
      display: grid;
      gap: 0.65rem;
    }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      padding: 0.75rem 1rem;
    }
    button[type="submit"] {
      background: var(--sci-teal);
      color: #fff;
    }
    button[type="button"] {
      background: #dff5f3;
      color: var(--sci-teal);
    }
    #resultado {
      margin-top: 1rem;
      padding: 0.85rem;
      background: var(--sci-surface);
      border: 1px solid var(--sci-border);
      border-radius: 12px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    #resultado:empty { display: none; }
    .error { color: var(--sci-danger); }
    @media (min-width: 560px) {
      .actions { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Consulta de Documento Emitido</h1>
    <p class="sub">Módulo SCI — vista móvil</p>
    <form id="consultaForm">
      <label for="clave">Clave electrónica</label>
      <input type="text" id="clave" name="clave" inputmode="numeric" required>
      <div class="actions">
        <button type="submit">Consultar</button>
        <button type="button" id="tokenBtn">Obtener Token</button>
      </div>
    </form>
    <div id="resultado"></div>
  </main>

  <script>
    const resultado = document.getElementById('resultado');

    document.getElementById('consultaForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const clave = document.getElementById('clave').value.trim();
      resultado.innerHTML = '<p>Consultando…</p>';

      try {
        const response = await fetch(`/api/facturas/${encodeURIComponent(clave)}`);
        if (!response.ok) throw new Error('Error en la consulta');
        const data = await response.json();

        resultado.innerHTML = `
          <p><strong>Clave:</strong> ${data.clave ?? data.claveelectronica ?? '—'}</p>
          <p><strong>Cliente:</strong> ${data.cliente ?? data.nombrecliente ?? '—'}</p>
          <p><strong>Monto:</strong> ${data.monto ?? data.total ?? '—'}</p>
          <p><strong>Estado:</strong> ${data.estado ?? '—'}</p>
        `;
      } catch (err) {
        resultado.innerHTML = `<p class="error">${err.message}</p>`;
      }
    });

    document.getElementById('tokenBtn').addEventListener('click', async function() {
      resultado.innerHTML = '<p>Solicitando token…</p>';
      try {
        const response = await fetch('/api/hacienda/token', { method: 'POST' });
        if (!response.ok) throw new Error('No se pudo obtener el token');
        const data = await response.json();
        resultado.innerHTML = `<p>${data.mensaje || 'Token creado'}</p>`;
      } catch (err) {
        resultado.innerHTML = `<p class="error">${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
